<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#182e32" />
    <meta
      name="description"
      content="My AI Campus Life: a trilingual Hong Kong campus adventure about ethical and inclusive AI in language learning."
    />
    <title>我的AI校園生活</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23182e32'/%3E%3Ccircle cx='28' cy='27' r='14' fill='none' stroke='%23f3d27c' stroke-width='6'/%3E%3Cpath d='m39 38 13 13' stroke='%23f3d27c' stroke-width='7'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="campus-polish.css" />
    <link rel="stylesheet" href="ui-glass.css" />
    <link rel="stylesheet" href="teacher-ui.css" />
    <link rel="stylesheet" href="campus-life.css" />
    <link rel="stylesheet" href="campus-panels.css" />
    <link rel="stylesheet" href="worksheet-ui.css" />
    <link rel="stylesheet" href="campus-pixel-ui.css" />
    <script defer src="content.js"></script>
    <script defer src="subjects.js"></script>
    <script defer src="grade-content.js"></script>
    <script defer src="campus-art.js"></script>
    <script defer src="characters.js"></script>
    <script defer src="campus-routines.js"></script>
    <script defer src="engine.js"></script>
    <script defer src="campus-cloud.js"></script>
    <script defer src="xlsx-export.js"></script>
    <script defer src="worksheet-ui.js"></script>
    <script defer src="teacher-ui.js"></script>
    <script defer src="fixed-voices.js"></script>
    <script defer src="campus-audio.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#case-list" id="skip-link">跳至案件清單</a>
    <header class="topbar">
      <a href="#" class="brand" id="home-brand"
        ><span class="brand-mark" aria-hidden="true">⌕</span
        ><span id="brand-title"
          >我的AI校園生活<small>MY AI CAMPUS LIFE</small></span
        ></a
      >
      <div class="top-actions">
        <button id="teacher-button" class="quiet">教師手冊</button
        ><button id="settings-button" class="quiet">設定</button
        ><label class="language"
          ><span aria-hidden="true">A</span
          ><span class="sr-only" id="language-label">語言</span
          ><select id="language" aria-labelledby="language-label">
            <option value="zh">繁體中文</option>
            <option value="cn">简体中文</option>
            <option value="en">English</option>
          </select></label
        ><button id="audio-button" class="audio-button" aria-label="音量設定" aria-expanded="false" aria-controls="audio-panel"><img src="assets/icons/pixelarticons/music-sharp.svg" alt=""></button>
      </div>
      <section id="audio-panel" class="audio-panel" hidden role="region" aria-labelledby="audio-title"></section>
    </header>
    <section
      id="title-screen"
      class="title-screen"
      aria-label="遊戲主選單"
    ></section>
    <main class="workspace" hidden>
      <div class="chapter-heading">
        <div>
          <span class="eyebrow" id="chapter-label"
            >OPERATION CLEARVIEW · 01</span
          >
          <h1 id="location-title">明澄書院</h1>
        </div>
        <div class="chapter-status">
          <span class="status-dot"></span
          ><span id="status-text">調查準備中</span>
        </div>
      </div>
      <div class="play-layout">
        <section class="game-column" aria-label="Campus game">
          <div class="game-frame">
            <canvas
              id="campus"
              width="900"
              height="500"
              tabindex="0"
              aria-label="2D 校園。WASD 或方向鍵移動，空格或 Enter 互動。點擊地面可移動，點擊人物或房門可走近互動。"
            ></canvas>
            <div class="scene-tag" id="scene-tag"><img class="scene-location-icon" src="assets/icons/pixelarticons/map-pin.svg" alt=""><span class="scene-location-copy">明澄書院 · 地下走廊</span></div>
            <button
              id="fullscreen-button"
              class="scene-tool"
              aria-label="全螢幕"
            >
              ⛶
            </button>
            <div id="intro" class="intro"></div>
            <div id="dialogue" class="dialogue-layer" hidden></div>
            <div id="scene-toast" class="scene-toast" role="status"></div>
            <nav id="game-hud" class="game-hud" aria-label="遊戲工具">
              <span id="hud-stars" class="hud-stars">★ 0 / 100</span>
              <button data-action="cases" id="hud-cases"><img class="hud-icon" src="assets/icons/pixelarticons/file-text-sharp.svg" alt=""><span class="hud-label">案件</span></button>
              <button data-action="subjects" id="hud-subjects"><img class="hud-icon" src="assets/icons/pixelarticons/book-open-sharp.svg" alt=""><span class="hud-label">學科</span></button>
              <button data-action="map" id="hud-map"><img class="hud-icon" src="assets/icons/pixelarticons/map-pin.svg" alt=""><span class="hud-label">地圖</span></button>
              <button data-action="journal" id="hud-journal"><img class="hud-icon" src="assets/icons/pixelarticons/notebook-sharp.svg" alt=""><span class="hud-label">手帳</span></button>
              <button data-action="printer" id="hud-printer"><img class="hud-icon" src="assets/icons/pixelarticons/printer-minimal-sharp.svg" alt=""><span class="hud-label">打印</span></button>
              <button data-action="settings" id="hud-settings"><img class="hud-icon" src="assets/icons/pixelarticons/settings-cog.svg" alt=""><span class="hud-label">設定</span></button>
            </nav>
            <section
              id="modal"
              class="game-panel"
              hidden
              role="region"
              aria-labelledby="modal-title"
            >
              <div class="modal-heading">
                <div>
                  <span id="modal-eyebrow" class="eyebrow"></span>
                  <h2 id="modal-title"></h2>
                </div>
                <button id="close-modal" class="close-button" aria-label="關閉">
                  ×
                </button>
              </div>
              <div id="modal-content"></div>
              <div id="panel-portrait" class="portrait panel-portrait" hidden aria-hidden="true"></div>
            </section>
          </div>
          <div class="game-controls">
            <div class="control-keys">
              <button id="left" aria-label="向左走">←</button
              ><button id="right" aria-label="向右走">→</button
              ><span id="walk-hint">移動</span
              ><button id="interact" class="interact-button">
                E <span id="talk-label">對話 / 進入</span>
              </button>
            </div>
            <span class="mouse-hint" id="mouse-hint">也可點擊地面移動</span
            ><button id="map-button" class="text-button">校園地圖 ↗</button>
          </div>
          <div class="ethics-note">
            <span class="tiny-symbol">✦</span>
            <p id="ethics-note"></p>
          </div>
        </section>
        <aside class="case-sidebar">
          <div class="notebook-heading">
            <span class="eyebrow" id="notebook-label">DETECTIVE NOTEBOOK</span>
            <div>
              <h2 id="notebook-title">調查手帳</h2>
              <span class="progress-count" id="progress-count">0 / 4</span>
            </div>
          </div>
          <div id="case-list" tabindex="-1"></div>
          <button id="journal-button" class="journal-button">
            <span>▤</span><span id="journal-label">我的結案報告</span
            ><span>↗</span>
          </button>
          <div class="sidebar-foot">
            <span class="save-dot"></span
            ><span id="save-label">進度只儲存在這個瀏覽器</span>
          </div>
        </aside>
      </div>
      <footer>
        <span id="footer-title">ETHICAL & INCLUSIVE AI PRACTICES</span
        ><span id="footer-meta">MEDD8934 · 學習遊戲原型</span>
      </footer>
    </main>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
    <noscript
      >This learning game requires JavaScript. 此學習遊戲需要啟用
      JavaScript。</noscript
    >
  </body>
</html>
