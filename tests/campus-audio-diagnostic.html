<!doctype html><html lang="en"><meta charset="utf-8"><title>Campus audio diagnostic — isolated test</title><base href="../public/campus/"><style>body{font:16px system-ui;background:#123c43;color:#eef5ee;margin:32px;max-width:1000px}button{font:inherit;padding:12px;margin:4px;border-radius:10px}pre{white-space:pre-wrap;background:#092a30;padding:16px;border-radius:12px}h2{font-size:18px}</style><h1>Campus audio diagnostic</h1><p>Temporary diagnostic fixture. Uses no student records. Signal readings describe generated audio, not whether a person hears it.</p><button id="music">Play Greensleeves at 100%</button><button id="stop">Pause music</button><button id="zh">Test Cantonese</button><button id="cn">Test Mandarin</button><button id="en">Test English</button><label>Character gender <select id="gender"><option value="">Any (language check)</option><option value="female">Female NPC</option><option value="male">Male NPC</option></select></label><button id="recorded-cn">Play bundled Mandarin</button><button id="recorded-en">Play bundled English</button><p id="recorded-line"></p><button id="scenario">Test switch and full completions</button><h2>Scenario result</h2><pre id="scenario-result">Not run</pre><h2>Speech event history</h2><pre id="history"></pre><h2>Playback state</h2><pre id="state">Not started</pre><h2>Output signal</h2><pre id="signal">No audio context</pre><h2>Available voices</h2><pre id="voices">Loading</pre><script>
const NativeContext=window.AudioContext||window.webkitAudioContext;
const observations=[];
if(NativeContext){window.AudioContext=class extends NativeContext{constructor(){super();this.meter=this.createAnalyser();this.meter.fftSize=2048;this.meter.connect(this.destination);observations.push(this);}createGain(){const gain=super.createGain(),connect=gain.connect.bind(gain);gain.connect=(destination,...args)=>connect(destination===this.destination?this.meter:destination,...args);return gain;}};}
</script><script src="characters.js"></script><script src="fixed-voices.js"></script><script src="campus-audio.js"></script><script>
let scenario='idle',events=[],previousSignature='',scenarioTimer=null;
function onAudioState(s){
 document.getElementById('state').textContent=JSON.stringify(s,null,2);
 const signature=JSON.stringify([s.voice.status,s.voice.actualLocale,s.voice.lastEvent,s.voice.attempt,s.voice.errorCode]);
 if(signature!==previousSignature){previousSignature=signature;events.push(`${new Date().toISOString()} ${signature}`);document.getElementById('history').textContent=events.slice(-25).join('\n');}
 if(scenario==='wait-zh'&&s.voice.status==='speaking'&&s.voice.requestedLocale==='zh-HK'){
  scenario='switch-pending';scenarioTimer=setTimeout(()=>{scenario='wait-en';audio.stopVoice();audio.speak({key:'scenario-en',text:'Welcome to our school. We will check the evidence before we use an AI answer. Everyone should be able to take part.',locale:'en'});},1000);
 }
 if(scenario==='wait-en'&&s.voice.status==='ready'&&s.voice.lastEvent==='end'&&s.voice.requestedLocale==='en-GB'){
  scenario='wait-cn';audio.speak({key:'scenario-cn',text:'欢迎来到我们的学校。使用人工智能答案以前，我们应该检查证据。',locale:'cn'});
 }
 if(scenario==='wait-cn'&&s.voice.status==='ready'&&s.voice.lastEvent==='end'&&s.voice.requestedLocale==='zh-CN'){
  scenario='complete';document.getElementById('scenario-result').textContent='PASS: switched away from started Cantonese; English and Mandarin both completed with end events.';
 }
 if(!['idle','complete','failed'].includes(scenario)&&s.voice.status==='error'){
  scenario='failed';document.getElementById('scenario-result').textContent='FAILED: '+JSON.stringify(s.voice);
 }
}
const audio=CampusAudio.create({onState:onAudioState});
document.getElementById('scenario').onclick=async()=>{
 clearTimeout(scenarioTimer);scenario='idle';audio.stopVoice();await audio.unlock();audio.setSettings({voiceVolume:.8,muted:false});audio.setMusicPlaying(false);events=[];previousSignature='';scenario='wait-zh';document.getElementById('scenario-result').textContent='Running: Cantonese → interrupt → English end → Mandarin end';
 audio.speak({key:'scenario-zh-'+Date.now(),text:'歡迎來到明澄書院。我們今天會一起探索校園，閱讀資料，並且思考人工智能如何影響不同同學。每個人都應該有參與的機會。',locale:'zh'});
};
document.getElementById('music').onclick=async()=>{await audio.unlock();audio.setSettings({musicVolume:1,voiceVolume:.8,muted:false});audio.setMusicPlaying(true);};
document.getElementById('stop').onclick=()=>audio.setMusicPlaying(false);
for(const locale of ['zh','cn','en'])document.getElementById(locale).onclick=async()=>{await audio.unlock();audio.setSettings({voiceVolume:.8,muted:false});const gender=document.getElementById('gender').value;audio.speak({key:'diagnostic-'+locale+'-'+gender+'-'+Date.now(),locale,gender,characterId:'diagnostic',text:locale==='cn'?'欢迎来到我们的学校。我们一起读懂资料，再作出判断。':locale==='en'?'Welcome to our school. Read the evidence, then make your decision.':'歡迎嚟到我哋嘅學校。我哋一齊睇清楚資料，再作決定。'});};
for(const locale of ['cn','en'])document.getElementById('recorded-'+locale).onclick=async()=>{
 await audio.unlock();audio.setSettings({voiceVolume:.8,muted:false});audio.setMusicPlaying(false);
 const gender=document.getElementById('gender').value||'male';
 const clip=window.CAMPUS_FIXED_VOICES.clips.find(c=>c.locale===locale&&c.gender===gender&&c.approved);
 if(!clip){document.getElementById('recorded-line').textContent='Missing matching bundled clip';return;}
 document.getElementById('recorded-line').textContent=clip.characterId+' | '+clip.voice+' | '+clip.text;
 audio.speak({key:'bundled-'+Date.now(),kind:'dialogue',locale,gender,characterId:clip.characterId,text:clip.text});
};
function voices(){document.getElementById('voices').textContent=(speechSynthesis.getVoices()||[]).map(v=>`${v.lang} | ${v.name} | local:${v.localService}`).join('\n')||'No voices yet';}speechSynthesis.addEventListener('voiceschanged',voices);voices();
let last=0,peak=0;function tick(time){if(time-last>300){last=time;const c=observations.at(-1);if(c){const data=new Float32Array(c.meter.fftSize);c.meter.getFloatTimeDomainData(data);const rms=Math.sqrt(data.reduce((s,v)=>s+v*v,0)/data.length);peak=Math.max(peak,...data.map(Math.abs));document.getElementById('signal').textContent=JSON.stringify({contextState:c.state,currentTime:c.currentTime,rms,rmsDb:rms>0?20*Math.log10(rms):null,maximumPeak:peak},null,2);}}requestAnimationFrame(tick);}requestAnimationFrame(tick);window.addEventListener('pagehide',()=>audio.dispose());
</script></html>
