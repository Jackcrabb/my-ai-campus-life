<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/public/campus/"><title>NPC identity and alpha review</title><style>body{margin:20px;background:#e9eee7;color:#173f48;font:14px system-ui}main{display:grid;grid-template-columns:repeat(4,264px);gap:16px}article{padding:12px;background:#fff9;border-radius:12px}h1{font-size:20px}h2{font-size:14px;margin:0 0 8px}.pair{display:flex;gap:8px}.portrait{width:116px;height:116px;background-color:#d6e0d9;background-repeat:no-repeat;image-rendering:auto}.portrait:last-child{background-color:#23484b}small{display:block;margin-top:8px}</style><script defer src="characters.js"></script></head><body><h1>NPC identity and transparency — development fixture</h1><p>Neutral and conversation crops use the exact same source identity as the full body. No raster pixels are changed.</p><main></main><script>addEventListener('DOMContentLoaded',()=>{for(const character of Object.values(CAMPUS_CHARACTERS.byId)){const card=document.createElement('article'),title=document.createElement('h2'),pair=document.createElement('div'),caption=document.createElement('small');title.textContent=character.name.zh;pair.className='pair';for(const talking of [false,true]){const crop=CAMPUS_CHARACTERS.portrait(character.id,talking),portrait=document.createElement('div');portrait.className='portrait';portrait.style.backgroundImage=`url('${crop.src}')`;portrait.style.backgroundSize=`${crop.sheetWidth/crop.w*100}% ${crop.sheetHeight/crop.h*100}%`;portrait.style.backgroundPosition=`${crop.x/(crop.sheetWidth-crop.w)*100}% ${crop.y/(crop.sheetHeight-crop.h)*100}%`;pair.append(portrait);}caption.textContent=character.id;card.append(title,pair,caption);document.querySelector('main').append(card);}});</script></body></html>
