<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/public/campus/"><title>Localized skin palette verification</title><style>body{margin:20px;background:#e9eee7;color:#173f48;font:14px system-ui}main{display:grid;grid-template-columns:repeat(6,180px);gap:12px}figure{margin:0;background:#fff9;border-radius:12px;text-align:center}canvas{display:block;width:180px;height:310px}h1{font-size:20px}p{max-width:1000px}</style><script defer src="characters.js"></script><script defer src="engine.js"></script></head><body><h1>Localized skin palette verification — development fixture</h1><p>Each group compares the original, medium and dark choices. Source hair, eyes, clothing, belts, socks and shoes must stay unchanged. First row uses idle; second uses a walking contact pose.</p><main id="previews"></main><script>addEventListener('DOMContentLoaded',()=>{for(const walking of [false,true])for(const gender of ['boy','girl'])for(const skin of [0,1,2]){const uniform=Number(new URLSearchParams(location.search).get('uniform'))||0;const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=360;canvas.height=620;canvas.dataset.skin=skin;canvas.dataset.gender=gender;canvas.dataset.walking=walking;caption.textContent=gender+' · '+skin+' · '+(walking?'walk':'idle');figure.append(canvas,caption);document.getElementById('previews').append(figure);CampusEngine.drawPlayerPreview(canvas,{gender,uniform,hair:walking?1:0,skin},{walking,phase:Math.PI});}});</script></body></html>
